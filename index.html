<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogBook | ibis Styles</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
    CABEÇALHO
    ====================================================== -->

    <header class="topo">

        <div class="container">

            <div class="text-center py-4">

                <img src="img/logo.png" class="logo mb-3" alt="ibis Styles">

                <h1>LogBook</h1>

                <p>Registro de Ocorrências</p>

            </div>

        </div>

    </header>

    <!-- =====================================================
    CONTEÚDO
    ====================================================== -->

    <main class="container my-4">

        <!-- Informações -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-4">

                        <label class="form-label">

                            <i class="bi bi-calendar3"></i>

                            Data

                        </label>

                        <input
                            id="data"
                            type="date"
                            class="form-control">

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">

                            <i class="bi bi-person"></i>

                            Funcionário

                        </label>

                        <select
                            id="funcionario"
                            class="form-select">

                            <option>Isaías</option>
                            <option>João</option>
                            <option>Maria</option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">

                            <i class="bi bi-clock"></i>

                            Turno

                        </label>

                        <select
                            id="turno"
                            class="form-select">

                            <option>Manhã</option>
                            <option>Tarde</option>
                            <option>Noite</option>

                        </select>

                    </div>

                </div>

            </div>

        </div>

        <!-- Botões -->

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

            <button
                class="btn btn-success btn-lg"
                data-bs-toggle="modal"
                data-bs-target="#modalRegistro">

                <i class="bi bi-plus-circle"></i>

                Novo Registro

            </button>

        <button
    class="btn btn-outline-success"
    onclick="exportarPDF()">

    <i class="bi bi-file-earmark-pdf"></i>

    Exportar PDF

</button>

        </div>

        <!-- Pesquisa -->

        <div class="mb-4">

            <input
                type="text"
                class="form-control"
                placeholder="Pesquisar por quarto, atividade ou descrição...">

        </div>

        <!-- Tabela -->

        <div class="card border-0 shadow-sm">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-success">

                        <tr>

                            <th width="90">Hora</th>

                            <th width="220">Atividade</th>

                            <th width="120">Quarto</th>

                            <th>Descrição</th>

                            <th width="120">Ações</th>

                        </tr>

                    </thead>

                    <tbody id="listaRegistros">

                        <tr>

                            <td colspan="5"
                                class="text-center text-muted py-5">

                                Nenhum registro encontrado.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

    <!-- =====================================================
    MODAL
    ====================================================== -->

    <div class="modal fade"
        id="modalRegistro"
        tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h4>

                        Novo Registro

                    </h4>

                    <button
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="row g-3">

                        <div class="col-md-3">

                            <label>Hora</label>

                            <input
                                id="hora"
                                type="time"
                                class="form-control">

                        </div>

                        <div class="col-md-4">

                            <label>Atividade</label>

                            <select
                                id="atividade"
                                class="form-select">

                                <option>Check-in</option>
                                <option>Check-out</option>
                                <option>Cancelamento</option>
                                <option>Estorno</option>
                                <option>Despertar</option>
                                <option>Walk-in</option>
                                <option>No Show</option>

                            </select>

                        </div>

                        <div class="col-md-2">

                            <label>Quarto</label>

                            <input
                                id="quarto"
                                type="number"
                                class="form-control">

                        </div>

                        <div class="col-md-12">

                            <label>Descrição</label>

                            <textarea
                                id="descricao"
                                rows="4"
                                class="form-control"></textarea>

                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        id="btnSalvar"
                        class="btn btn-success">

                        Salvar Registro

                    </button>

                </div>

            </div>

        </div>

    </div>

  <!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- AutoTable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- Scripts -->
<script src="script.js"></script>
<script src="pdf.js"></script>

</body>

</html>
