<!-- =====================================================
FILTROS E ORDENAÇÃO DA TABELA
====================================================== -->

<script>

(function() {


    // =================================================
    // ELEMENTOS
    // =================================================

    const filtro =
        document.getElementById(
            "filtroAtividade"
        );


    const ordenarPor =
        document.getElementById(
            "ordenarPor"
        );


    const ordem =
        document.getElementById(
            "ordem"
        );


    const pesquisa =
        document.getElementById(
            "pesquisa"
        );


    const btnLimpar =
        document.getElementById(
            "btnLimparFiltros"
        );


    const contador =
        document.getElementById(
            "textoContadorFiltro"
        );


    const contadorRegistros =
        document.getElementById(
            "contadorRegistros"
        );



    // =================================================
    // APLICA FILTROS
    // =================================================

    function aplicarFiltrosETabela() {


        if (
            typeof registros ===
            "undefined"
        ) {

            return;

        }


        let resultado =
            [...registros];


        // =============================================
        // PESQUISA
        // =============================================

        const texto =
            (
                pesquisa?.value ||
                ""
            )
                .trim()
                .toLowerCase();


        if (texto !== "") {

            resultado =
                resultado.filter(
                    function(registro) {

                        const conteudo = [

                            registro.hora,

                            registro.atividade,

                            registro.quarto,

                            registro.quartoDestino,

                            registro.descricao,

                            registro.pagamento,

                            registro.valor,

                            registro.reserva,

                            registro.despertar

                        ]
                            .filter(
                                valor =>
                                    valor !==
                                    undefined &&
                                    valor !==
                                    null
                            )
                            .join(" ")
                            .toLowerCase();


                        return conteudo.includes(
                            texto
                        );

                    }
                );

        }



        // =============================================
        // FILTRO POR ATIVIDADE
        // =============================================

        const atividade =
            filtro?.value || "";


        if (atividade !== "") {

            resultado =
                resultado.filter(
                    function(registro) {

                        return (
                            registro.atividade ===
                            atividade
                        );

                    }
                );

        }



        // =============================================
        // ORDENAÇÃO
        // =============================================

        const campo =
            ordenarPor?.value ||
            "hora";


        const direcao =
            ordem?.value ||
            "asc";


        resultado.sort(
            function(a, b) {


                let valorA =
                    obterValorOrdenacao(
                        a,
                        campo
                    );


                let valorB =
                    obterValorOrdenacao(
                        b,
                        campo
                    );


                let comparacao = 0;


                if (
                    typeof valorA ===
                        "number" &&
                    typeof valorB ===
                        "number"
                ) {

                    comparacao =
                        valorA -
                        valorB;

                } else {

                    comparacao =
                        String(valorA)
                            .localeCompare(
                                String(valorB),
                                "pt-BR",
                                {
                                    numeric: true,
                                    sensitivity: "base"
                                }
                            );

                }


                return direcao === "desc"
                    ? comparacao * -1
                    : comparacao;

            }
        );



        // =============================================
        // MOSTRA RESULTADO
        // =============================================

        atualizarTabelaComFiltro(
            resultado
        );


        atualizarContadores(
            resultado.length
        );

    }



    // =================================================
    // VALOR PARA ORDENAÇÃO
    // =================================================

    function obterValorOrdenacao(
        registro,
        campo
    ) {


        switch (campo) {


            case "hora":

                return converterHora(
                    registro.hora
                );


            case "atividade":

                return (
                    registro.atividade ||
                    ""
                );


            case "quarto":

                return converterNumero(
                    registro.quarto
                );


            case "descricao":

                return (
                    gerarResumoFiltro(
                        registro
                    )
                );


            default:

                return "";

        }

    }



    // =================================================
    // CONVERTER HORA
    // =================================================

    function converterHora(
        hora
    ) {

        if (!hora) {

            return 999999;

        }


        const partes =
            String(hora).split(":");


        if (
            partes.length !== 2
        ) {

            return 999999;

        }


        return (
            Number(partes[0]) * 60 +
            Number(partes[1])
        );

    }



    // =================================================
    // CONVERTER NÚMERO
    // =================================================

    function converterNumero(
        valor
    ) {

        if (
            valor ===
            undefined ||
            valor ===
            null ||
            valor === ""
        ) {

            return 999999999;

        }


        const numero =
            Number(valor);


        return Number.isNaN(
            numero
        )
            ? 999999999
            : numero;

    }



    // =================================================
    // RESUMO PARA ORDENAÇÃO
    // =================================================

    function gerarResumoFiltro(
        registro
    ) {

        return [

            registro.descricao,

            registro.pagamento,

            registro.valor,

            registro.reserva,

            registro.despertar,

            registro.quartoDestino

        ]
            .filter(
                valor =>
                    valor !==
                    undefined &&
                    valor !==
                    null
            )
            .join(" ");

    }



    // =================================================
    // ATUALIZA TABELA
    // =================================================

    function atualizarTabelaComFiltro(
        lista
    ) {


        const tbody =
            document.getElementById(
                "listaRegistros"
            );


        if (!tbody) {

            return;

        }


        tbody.innerHTML = "";


        if (
            lista.length === 0
        ) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="text-center text-muted py-5">

                        <i
                            class="bi bi-search fs-1 d-block mb-2">
                        </i>

                        Nenhum registro encontrado
                        com os filtros selecionados.

                    </td>

                </tr>

            `;


            return;

        }



        lista.forEach(
            function(registro) {


                const indiceOriginal =
                    registros.indexOf(
                        registro
                    );


                let resumo = "";


                // =====================================
                // PAGAMENTO
                // =====================================

                if (
                    registro.pagamento
                ) {

                    resumo +=
                        "💳 " +
                        registro.pagamento +
                        " ";

                }


                // =====================================
                // VALOR
                // =====================================

                if (
                    registro.valor
                ) {

                    resumo +=
                        "R$ " +
                        registro.valor +
                        " ";

                }


                // =====================================
                // RESERVA
                // =====================================

                if (
                    registro.reserva
                ) {

                    resumo +=
                        "Reserva: " +
                        registro.reserva +
                        " ";

                }


                // =====================================
                // DESPERTAR
                // =====================================

                if (
                    registro.despertar
                ) {

                    resumo +=
                        "Despertar: " +
                        registro.despertar +
                        " ";

                }


                // =====================================
                // NOVO QUARTO
                // =====================================

                if (
                    registro.quartoDestino &&
                    (
                        registro.atividade ===
                            "Mudança de Quarto" ||
                        registro.atividade ===
                            "Troca de Quarto"
                    )
                ) {

                    resumo +=
                        "Novo quarto: " +
                        registro.quartoDestino +
                        " ";

                }


                // =====================================
                // DESCRIÇÃO
                // =====================================

                if (
                    registro.descricao
                ) {

                    if (
                        resumo !== ""
                    ) {

                        resumo +=
                            "<br>";

                    }


                    resumo +=
                        registro.descricao;

                }


                if (
                    resumo === ""
                ) {

                    resumo = "-";

                }


                // =====================================
                // ÍCONE
                // =====================================

                let icone = `
                    <i class="bi bi-clipboard"></i>
                `;


                switch (
                    registro.atividade
                ) {


                    case "Check-in":

                        icone = `
                            <i class="bi bi-person-check"></i>
                        `;

                        break;


                    case "Check-out":

                        icone = `
                            <i class="bi bi-box-arrow-right"></i>
                        `;

                        break;


                    case "Walk-in":

                        icone = `
                            <i class="bi bi-person-plus"></i>
                        `;

                        break;


                    case "Pagamento":

                        icone = `
                            <i class="bi bi-credit-card"></i>
                        `;

                        break;


                    case "Estorno":

                        icone = `
                            <i class="bi bi-arrow-counterclockwise"></i>
                        `;

                        break;


                    case "Cancelamento":

                        icone = `
                            <i class="bi bi-x-circle"></i>
                        `;

                        break;


                    case "No Show":

                        icone = `
                            <i class="bi bi-person-x"></i>
                        `;

                        break;


                    case "Procedimentos":

                        icone = `
                            <i class="bi bi-clipboard-check"></i>
                        `;

                        break;


                    case "Conferência":

                        icone = `
                            <i class="bi bi-clipboard-check"></i>
                        `;

                        break;


                    case "Manutenção":

                        icone = `
                            <i class="bi bi-tools"></i>
                        `;

                        break;


                    case "Mudança de Quarto":

                        icone = `
                            <i class="bi bi-door-open"></i>
                        `;

                        break;


                    case "Troca de Quarto":

                        icone = `
                            <i class="bi bi-door-open"></i>
                        `;

                        break;


                    case "Limpeza":

                        icone = `
                            <i class="bi bi-stars"></i>
                        `;

                        break;


                    case "Aviso":

                        icone = `
                            <i class="bi bi-info-circle"></i>
                        `;

                        break;


                    case "Reclamação":

                        icone = `
                            <i class="bi bi-exclamation-circle"></i>
                        `;

                        break;


                    case "Elogio":

                        icone = `
                            <i class="bi bi-hand-thumbs-up"></i>
                        `;

                        break;


                    case "Despertar":

                        icone = `
                            <i class="bi bi-alarm"></i>
                        `;

                        break;

                }



                // =====================================
                // LINHA
                // =====================================

                tbody.innerHTML += `

                    <tr>

                        <td>

                            ${registro.hora || "-"}

                        </td>


                        <td>

                            ${icone}

                            <span class="ms-1">

                                ${registro.atividade || "-"}

                            </span>

                        </td>


                        <td>

                            <strong>

                                ${registro.quarto || "-"}

                            </strong>

                        </td>


                        <td>

                            ${resumo}

                        </td>


              <td class="acoes-registro">

    <div class="acoes-registro-container">

        <button
            class="btn btn-sm btn-outline-primary"
            onclick="editarRegistro(${indiceOriginal})"
            title="Editar">

            <i class="bi bi-pencil"></i>

        </button>


        <button
            class="btn btn-sm btn-outline-danger"
            onclick="excluirRegistro(${indiceOriginal})"
            title="Excluir">

            <i class="bi bi-trash"></i>

        </button>


        <button
            class="btn btn-sm btn-outline-success"
            onclick="reportarRegistro(${indiceOriginal})"
            title="Gerar Report">

            <i class="bi bi-save"></i>

        </button>

    </div>

</td>

                    </tr>

                `;

            }
        );

    }



    // =================================================
    // CONTADORES
    // =================================================

    function atualizarContadores(
        quantidade
    ) {


        const total =
            registros.length;


        if (
            contadorRegistros
        ) {

            contadorRegistros.textContent =

                quantidade +
                (
                    quantidade === 1
                        ? " registro"
                        : " registros"
                );

        }


        if (
            contador
        ) {


            const temPesquisa =
                (
                    pesquisa?.value ||
                    ""
                ).trim() !== "";


            const temFiltro =
                (
                    filtro?.value ||
                    ""
                ) !== "";


            if (
                !temPesquisa &&
                !temFiltro
            ) {

                contador.innerHTML = `

                    <strong>
                        ${total}
                    </strong>

                    ${
                        total === 1
                            ? "registro no turno"
                            : "registros no turno"
                    }

                `;

                return;

            }


            contador.innerHTML = `

                <strong>
                    ${quantidade}
                </strong>

                de

                <strong>
                    ${total}
                </strong>

                ${
                    quantidade === 1
                        ? "registro"
                        : "registros"
                }

                encontrados

            `;

        }

    }



    // =================================================
    // EVENTOS
    // =================================================

    if (filtro) {

        filtro.addEventListener(
            "change",
            aplicarFiltrosETabela
        );

    }


    if (ordenarPor) {

        ordenarPor.addEventListener(
            "change",
            aplicarFiltrosETabela
        );

    }


    if (ordem) {

        ordem.addEventListener(
            "change",
            aplicarFiltrosETabela
        );

    }


    if (pesquisa) {

        pesquisa.addEventListener(
            "input",
            aplicarFiltrosETabela
        );

    }


    if (btnLimpar) {

        btnLimpar.addEventListener(
            "click",
            function() {


                if (pesquisa) {

                    pesquisa.value = "";

                }


                if (filtro) {

                    filtro.value = "";

                }


                if (ordenarPor) {

                    ordenarPor.value =
                        "hora";

                }


                if (ordem) {

                    ordem.value =
                        "asc";

                }


                aplicarFiltrosETabela();

            }
        );

    }



    // =================================================
    // ATUALIZA AUTOMATICAMENTE
    // QUANDO A TABELA NORMAL FOR ATUALIZADA
    // =================================================

    const atualizarOriginal =
        window.atualizarTabela;


    if (
        typeof atualizarOriginal ===
        "function"
    ) {

        window.atualizarTabela =
            function(lista) {

                aplicarFiltrosETabela();

            };

    }



    // =================================================
    // OBSERVADOR
    // =================================================

    setInterval(
        function() {

            if (
                typeof registros !==
                "undefined"
            ) {

                aplicarFiltrosETabela();

            }

        },
        500
    );


})();

</script>


</body>

</html>
