<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogBook - Ibis Styles</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="topo py-4 shadow-sm">

        <div class="container">

            <div class="text-center">

                <img src="img/logo.png" class="logo mb-3" alt="Logo">

                <h2 class="fw-bold text-success">
                    LogBook
                </h2>

                <p class="text-secondary">
                    Registro de Ocorrências
                </p>

            </div>

        </div>

    </header>

    <main class="container mt-4">

        <!-- Informações -->

        <div class="card border-0 shadow-sm mb-4">

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Data

                        </label>

                        <input type="date" class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Funcionário

                        </label>

                        <select class="form-select">

                            <option>Selecione...</option>

                            <option>Isaías</option>

                            <option>João</option>

                            <option>Maria</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Turno

                        </label>

                        <select class="form-select">

                            <option>Manhã</option>
                            <option>Tarde</option>
                            <option>Noite</option>

                        </select>

                    </div>

                </div>

            </div>

        </div>

        <!-- Botões -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <button class="btn btn-success btn-lg">

                ➕ Novo Registro

            </button>

            <button class="btn btn-outline-success">

                📄 Exportar PDF

            </button>

        </div>

        <!-- Pesquisa -->

        <div class="mb-4">

            <input type="text"
                class="form-control"
                placeholder="Pesquisar por quarto, atividade ou descrição...">

        </div>

        <!-- Tabela -->

        <div class="card shadow-sm border-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-success">

                        <tr>

                            <th>Hora</th>

                            <th>Atividade</th>

                            <th>Quarto</th>

                            <th>Descrição</th>

                            <th width="120">

                                Ações

                            </th>

                        </tr>

                    </thead>

                    <tbody id="tabela-registros">

                        <tr>

                            <td colspan="5" class="text-center text-muted py-5">

                                Nenhum registro encontrado.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
