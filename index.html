<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LogBook | ibis Styles</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css">
    <link rel="stylesheet" href="reports/reports.css">

</head>

<body>

<!-- =====================================================
CABEÇALHO
====================================================== -->

<header class="topo shadow-sm">

    <div class="container">

        <div class="text-center py-4">

            <img
                src="img/logo.png"
                class="logo mb-3"
                alt="ibis Styles">

            <h1 class="fw-bold">

                LogBook

            </h1>

            <p class="text-secondary">

                Registro de Ocorrências da Recepção

            </p>

        </div>

    </div>

</header>

<!-- =====================================================
CONTEÚDO
====================================================== -->

<main class="container my-4">

<!-- =====================================================
INFORMAÇÕES DO TURNO
====================================================== -->

<div class="card shadow-sm border-0 mb-4">

<div class="card-body">

<div class="row g-3">

<!-- Data -->

<div class="col-lg-4">

<label class="form-label">

<i class="bi bi-calendar3"></i>

Data

</label>

<input
id="data"
type="date"
class="form-control">

</div>

<!-- Funcionário -->

<div class="col-lg-4">

<label class="form-label">

<i class="bi bi-person-circle"></i>

Funcionário

</label>

<select
id="funcionario"
class="form-select">

<option>Isaias Padovezzi</option>
<option>Carol Ortiz</option>
<option>Filipe Morais</option>
    <option>Cleberson Souza</option>

</select>

</div>

<!-- Turno -->

<div class="col-lg-4">

<label class="form-label">

<i class="bi bi-clock"></i>

Turno

</label>

<select
id="turno"
class="form-select">

<option>11h-23h</option>
<option>15h-23h</option>
<option>7h-19h</option>

</select>

</div>

</div>

</div>

</div>

<!-- =====================================================
BOTÕES
====================================================== -->

<div class="d-flex justify-content-between flex-wrap gap-3 mb-4">

<button

class="btn btn-success btn-lg"

data-bs-toggle="modal"

data-bs-target="#modalRegistro">

<i class="bi bi-plus-circle"></i>

Novo Registro

</button>

<button

class="btn btn-outline-success"

onclick="exportarPDF()">

<i class="bi bi-file-earmark-pdf"></i>

Exportar PDF

</button>
    <button
    type="button"
    class="btn btn-outline-success"
    onclick="abrirArquivoLogbook()">

    <i class="bi bi-folder2-open"></i>

    Arquivo

</button>

</div>

<!-- =====================================================
PESQUISA
====================================================== -->

<div class="card shadow-sm border-0 mb-4">

<div class="card-body">

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-search"></i>

</span>

<input

id="pesquisa"

type="text"

class="form-control"

placeholder="Pesquisar quarto, atividade ou descrição...">

</div>

</div>

</div>

<!-- FIM DA PARTE 1 -->
  <!-- =====================================================
TABELA DE REGISTROS
====================================================== -->

<div class="card shadow-sm border-0">

    <div class="card-header bg-success text-white">

        <div class="d-flex justify-content-between align-items-center">

            <h5 class="mb-0">

                <i class="bi bi-journal-text"></i>

                Registros do Turno

            </h5>

            <span
                id="contadorRegistros"
                class="badge bg-light text-success">

                0 registros

            </span>

        </div>

    </div>

    <div class="table-responsive">

        <table
            class="table table-hover align-middle mb-0">

            <thead class="table-success">

                <tr>

                    <th width="90">

                        Hora

                    </th>

                    <th width="180">

                        Atividade

                    </th>

                    <th width="90">

                        Quarto

                    </th>

                    <th>

                        Resumo

                    </th>

                    <th width="120">

                        Ações

                    </th>

                </tr>

            </thead>

            <tbody id="listaRegistros">

                <tr>

                    <td
                        colspan="5"
                        class="text-center text-muted py-5">

                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>

                        Nenhum registro encontrado.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</main>

<!-- FIM DA PARTE 2 -->
  <!-- =====================================================
MODAL NOVO REGISTRO
====================================================== -->

<div
    class="modal fade"
    id="modalRegistro"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <!-- Cabeçalho -->

            <div class="modal-header bg-success text-white">

                <h5 class="modal-title">

                    <i class="bi bi-plus-circle"></i>

                    Novo Registro

                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <!-- Corpo -->

            <div class="modal-body">

                <div class="row g-3">

                    <!-- Hora -->

                    <div class="col-md-3">

                        <label class="form-label">

                            Hora

                        </label>

                        <input
                            id="hora"
                            type="time"
                            class="form-control">

                    </div>

                    <!-- Atividade -->

                    <div class="col-md-5">

                        <label class="form-label">

                            Atividade

                        </label>

                        <select
                            id="atividade"
                            class="form-select">

                            <option value="Check-in">Check-in</option>
                            <option value="Check-out">Check-out</option>
                            <option value="Walk-in">Walk-in</option>
                            <option value="No Show">No Show</option>
                            <option value="Cancelamento">Cancelamento</option>
                            <option value="Estorno">Estorno</option>
                            <option value="Despertar">Despertar</option>
                            <option value="Pagamento">Pagamento</option>
                            <option value="Depósito">Depósito</option>
                            <option value="Mudança de Quarto">Mudança de Quarto</option>
                            <option value="Manutenção">Manutenção</option>
                            <option value="Lost & Found">Lost & Found</option>
                            <option value="Reclamação">Reclamação</option>
                            <option value="Elogio">Elogio</option>
                            <option value="Elogio">Reservas</option>
                            <option value="Elogio">Lavanderia</option>
                            <option value="Elogio">Empréstimos</option>
                            <option value="Elogio">Conferência</option>
                            <option value="Outro">Outro</option>

                        </select>

                    </div>

                    <!-- Quarto -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Quarto

                        </label>

                        <input
                            id="quarto"
                            type="number"
                            class="form-control">

                    </div>

                    <!-- Forma de Pagamento -->

                    <div
                        id="grupoPagamento"
                        class="col-md-6"
                        style="display:none;">

                        <label class="form-label">

                            Forma de Pagamento

                        </label>

                        <select
                            id="pagamento"
                            class="form-select">

                            <option value="">Selecione...</option>
                            <option>Direto</option>
                            <option>Cartão</option>
                            <option>PIX</option>
                            <option>Dinheiro</option>
                            <option>Faturado</option>
                            <option>Cortesia</option>
                            <option>Voucher</option>

                        </select>

                    </div>

                    <!-- Valor -->

                    <div
                        id="grupoValor"
                        class="col-md-3"
                        style="display:none;">

                        <label class="form-label">

                            Valor

                        </label>

                        <input
                            id="valor"
                            type="number"
                            step="0.01"
                            class="form-control"
                            placeholder="0,00">

                    </div>

                    <!-- Nº Reserva -->

                    <div
                        id="grupoReserva"
                        class="col-md-4"
                        style="display:none;">

                        <label class="form-label">

                            Nº Reserva

                        </label>

                        <input
                            id="reserva"
                            type="text"
                            class="form-control">

                    </div>

                    <!-- Horário Despertar -->

                    <div
                        id="grupoDespertar"
                        class="col-md-4"
                        style="display:none;">

                        <label class="form-label">

                            Horário do Despertar

                        </label>

                        <input
                            id="horaDespertar"
                            type="time"
                            class="form-control">

                    </div>

                    <!-- Descrição -->

                    <div class="col-12">

                        <label class="form-label">

                            Descrição

                        </label>

                        <textarea
                            id="descricao"
                            rows="5"
                            class="form-control"
                            placeholder="Descreva a ocorrência..."></textarea>

                    </div>

                </div>

            </div>

            <!-- Rodapé -->

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button
                    id="btnSalvar"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Salvar Registro

                </button>

            </div>

        </div>

    </div>

</div>

<!-- FIM DA PARTE 3 -->
  <!-- =====================================================
SCRIPTS
====================================================== -->

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- jsPDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- jsPDF AutoTable -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<!-- Gerador de imagem dos Reports -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
<script src="config.js"></script>

<script src="script.js"></script>

<script src="pdf.js"></script>

<script src="reports/reports.js"></script>
    <!-- =====================================================
     MODAL - ARQUIVO DO LOGBOOK
     ===================================================== -->

<div
    class="modal fade"
    id="modalArquivoLogbook"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-folder2-open text-success"></i>

                    Arquivo do LogBook

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Fechar">
                </button>

            </div>


            <div class="modal-body">

                <div
                    id="listaArquivoLogbook"
                    class="list-group">

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
